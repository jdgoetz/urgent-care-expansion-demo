services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urgent_care_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d urgent_care_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data

volumes:
  demo_postgres_data:
